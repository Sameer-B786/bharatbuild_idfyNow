AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: IDfyNow Backend - API Gateway, Lambda, and S3 for Sections

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS,DELETE,PUT'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:
  # 1. S3 Bucket to store sections
  SectionsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: ['GET', 'PUT', 'POST', 'DELETE', 'HEAD']
            AllowedOrigins: ['*']

  # 2. Lambda Function
  CreateSectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      # This points to the lambda directory. AWS SAM CLI will package it.
      CodeUri: LAMBDA_1/create-class-lambda/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref SectionsBucket
      # Automatically creates IAM policy to read/write to the bucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref SectionsBucket
      Events:
        CreateSectionApi:
          Type: Api
          Properties:
            Path: /api/sections
            Method: post

  FetchSectionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: LAMBDA_2/fetch-sections-lambda/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref SectionsBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref SectionsBucket
      Events:
        FetchSectionsApi:
          Type: Api
          Properties:
            Path: /api/sections
            Method: get

  AttendanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: LAMBDA_3/attendance-lambda/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref SectionsBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref SectionsBucket
      Events:
        AttendanceApi:
          Type: Api
          Properties:
            Path: /api/attendance
            Method: post

  DeleteSectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: LAMBDA_4/delete-section-lambda/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref SectionsBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref SectionsBucket
      Events:
        DeleteSectionApi:
          Type: Api
          Properties:
            Path: /api/sections
            Method: delete

  OcrVerificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: LAMBDA_5/ocr-verification-lambda/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 45
      MemorySize: 512
      Policies:
        - S3ReadPolicy:
            BucketName: "*"
        - Statement:
            - Effect: Allow
              Action:
                - textract:DetectDocumentText
                - textract:StartDocumentTextDetection
                - textract:GetDocumentTextDetection
              Resource: "*"
      Events:
        VerifyOcrApi:
          Type: Api
          Properties:
            Path: /api/verify-ocr
            Method: post

Outputs:
  ApiGatewayEndpoint:
    Description: "API Gateway endpoint URL for frontend NEXT_PUBLIC_API_URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/sections"
  S3BucketName:
    Description: "Name of the S3 bucket created for sections"
    Value: !Ref SectionsBucket
